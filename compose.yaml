services:
  discord-mcp:
    build: .
    restart: unless-stopped
    # DISCORD_BOT_TOKEN, MCP_ADMIN_TOKEN (openssl rand -hex 32) and MCP_PUBLIC_URL.
    # Leave MCP_HOST, MCP_PORT and MCP_DATA_DIR out of it: the image sets them.
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      # Point the reverse proxy at this port. Do not expose it directly:
      # without TLS the tokens travel in the clear.
      - "8809:8000"
